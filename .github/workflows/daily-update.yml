name: Daily Dashboard Update

on:
  schedule:
    # Runs at 06:00 UTC every day. GitHub Actions schedules are UTC and
    # don't auto-adjust for BST/GMT, so this will drift by an hour during
    # British Summer Time - fine for a daily refresh, not worth fixing.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Lets you trigger a run manually from the GitHub Actions tab too,
    # e.g. if you want fresh data right now without waiting for 6am.

permissions:
  contents: write
  # Needed so this workflow can commit the updated data files back to
  # the repo - the default token GitHub gives it is read-only unless
  # this is explicitly granted (see setup note in the setup steps).

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Scrape current availability
        run: python scrape_physio.py

      - name: Scrape physio roster
        run: python scrape_physio_roster.py

      - name: Rebuild dashboard data
        run: python build_dashboard_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_sites_slots.csv all_sites_day_summary.csv site_status_summary.csv physio_roster.csv site_physio_counts.csv dashboard_data.json
          git diff --staged --quiet || git commit -m "Automated daily data update"
          git push
